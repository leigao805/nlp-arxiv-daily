user_name: "leigao805"
repo_name: "nlp-arxiv-daily"
show_authors: True
show_links: True
show_badge: False
max_results: 10

publish_readme: False
publish_gitpage: True

json_gitpage_path: "./docs/nlp-arxiv-daily-web.json"
md_gitpage_path: "./docs/index.md"
archive_gitpage_json_dir: "./docs/archive-web"
archive_gitpage_md_dir: "./docs/archive-web"

# keywords to search
# 注意:arXiv API 不支持分类过滤,这里全靠关键词在 title+abstract 命中。
keywords:
  "Vision-Language-Action":
    filters: ["vision-language-action", "VLA", "robot foundation model", "robotic foundation model"]
  "VLA Models":
    filters: ["OpenVLA", "RT-2", "RT-1", "Pi0", "RDT-1B", "Octo Model"]
  "Robot Manipulation":
    filters: ["robot manipulation", "dexterous manipulation", "bimanual manipulation"]
  "Imitation Learning":
    filters: ["imitation learning", "behavior cloning", "diffusion policy"]
  "Embodied AI":
    filters: ["embodied AI", "embodied intelligence", "language conditioned robot"]
  "Benchmarks":
    filters: ["LIBERO", "RLBench", "MetaWorld", "CALVIN", "Open X-Embodiment"]
